[project]
name = "mlx-classifiers"
version = "0.0.1"
description = "System One style typed decisions from an MLX-LM decoder: prefill-only readout, masked softmax over declared options, calibrated probabilities."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Maddie Lovelace" }]
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
# The MLX runner is optional so the schema/readout core stays importable
# (and testable) on machines without Apple silicon. Pin decided in Epic 2.
mlx = ["mlx-lm>=0.31.3"]
# Image blocks (Epic 6): the vendored Gemma 4 vision path needs Pillow to decode
# and resize PNGs. No mlx-vlm at runtime.
vision = ["mlx-lm>=0.31.3", "pillow>=10.3"]
# Dev-only reference for the story 6.4 parity test; never imported at runtime.
# mlx-vlm 0.7.8 needs mlx >= 0.32.3, so installing it here moves the mlx pin; the
# test also runs against a separate venv via MLX_VLM_PYTHON.
vision-dev = ["mlx-vlm>=0.7.8"]
server = ["litestar>=2.12", "uvicorn>=0.30"]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
mlx-classifiers = "mlx_classifiers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_classifiers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["mlx: loads real model weights and runs on the GPU (skipped if not cached)"]

[tool.ruff]
line-length = 100
target-version = "py312"
